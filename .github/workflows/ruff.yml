name: ruff

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.4"
          args: "check --output-format=github"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.4"
          args: "format --check --diff"
