name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (e.g. 0.0.1)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build FSTs and distributions
        run: |
          echo "${{ inputs.version }}" > VERSION
          git clone --depth 1 https://github.com/wenet-e2e/WeTextProcessing.git /tmp/WeTextProcessing
          python -m pip install -U /tmp/WeTextProcessing build modelscope-hub setuptools twine wheel
          PYTHONPATH=/tmp/WeTextProcessing python build_fsts.py
          python -m build
      - name: Upload FSTs to ModelScope
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          ms login --token "$MODELSCOPE_API_TOKEN"
          ms whoami
          ms upload pengzhendong/wetext wetext/fsts --repo-type model --commit-message "Update FSTs for ${{ inputs.version }}"
      - name: Upload distributions to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
