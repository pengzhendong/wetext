name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (e.g. 0.0.1)"
        required: true
      upstream_ref:
        description: "WeTextProcessing commit or tag used to build models"
        required: true
        default: "943259052c15bd6999f5c46d931241d5e9b4df86"
      upload_fsts:
        description: "Upload generated FSTs to ModelScope"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build FSTs and distributions
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          echo "${{ inputs.version }}" > VERSION
          git clone https://github.com/wenet-e2e/WeTextProcessing.git /tmp/WeTextProcessing
          git -C /tmp/WeTextProcessing checkout "$UPSTREAM_REF"
          python -m pip install -U -e . /tmp/WeTextProcessing build modelscope-hub pytest setuptools twine wheel
          PYTHONPATH=/tmp/WeTextProcessing python build_fsts.py
          python -m pytest tests -q
          python -m build
      - name: Upload FSTs to ModelScope
        if: ${{ inputs.upload_fsts }}
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          modelscope-hub login --token "$MODELSCOPE_API_TOKEN"
          modelscope-hub whoami
          modelscope-hub upload pengzhendong/wetext wetext/fsts --repo-type model --commit-message "Update FSTs for ${{ inputs.version }}"
      - name: Upload distributions to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
